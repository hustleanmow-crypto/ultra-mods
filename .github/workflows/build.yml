name: Build prototype

on:
  push:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate prototype files
        run: |
          test -f README.md
          test -f mod_config.json
          test -f src/spawn_mapping.c
          echo "Prototype mapping validated"
